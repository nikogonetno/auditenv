name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: make verify on Python 3.11 with three hash seeds
        run: |
          for s in 0 1 random; do
            echo "### PYTHONHASHSEED=$s"
            PYTHONHASHSEED=$s make verify PY=python3
          done

      - name: docker build and offline run
        run: make docker-verify

      # The closed jury run of README («Закрытый прогон жюри»), word for word, on a hidden set of two episodes.
      - name: closed run of a hidden episode set in Docker under auditpolicy
        run: |
          mkdir -m 755 policy && cp examples/my_policy.py policy/
          mkdir -m 700 jury_in jury_out
          python3 -c 'import json; s = json.load(open("configs/dev_v2.json")); json.dump({"version": "ci_pair", "split": "ci", "episodes": s["episodes"][:2]}, open("jury_in/hidden_set.json", "w"))'
          docker run --rm --network none -v "$PWD/policy:/policy:ro" -v "$PWD/jury_in:/in:ro" -v "$PWD/jury_out:/out" auditenv:dev python3 -m auditenv.run --policy-cmd "python3 /policy/my_policy.py" --config /in/hidden_set.json --mode eval --sandbox required --trajectories /out/trajectories.jsonl --grader-log /out/grader_log.jsonl | tee closed_run.jsonl
          sudo chown -R "$(id -u):$(id -g)" jury_out
          python3 - <<'CHECK'
          import json
          lines = [json.loads(line) for line in open("closed_run.jsonl")]
          *episodes, total = lines
          assert len(episodes) == 2 and total["episodes"] == 2 and total["episode_set"] == "ci_pair", lines
          for r in episodes:
              assert (r["sandbox"], r["steps"], r["terminated"], r["truncated"]) == ("uid", 2, True, False), r
          seen = {json.loads(line)["episode_id"] for line in open("jury_out/trajectories.jsonl")}
          assert seen == {r["episode_id"] for r in episodes}, seen
          assert len(open("jury_out/grader_log.jsonl").read().splitlines()) == 2
          print("closed run of the set: 2 episodes, trajectories and grader log in jury_out")
          CHECK
