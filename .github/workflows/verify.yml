name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: make verify on Python 3.11 with three hash seeds
        run: |
          for s in 0 1 random; do
            echo "### PYTHONHASHSEED=$s"
            PYTHONHASHSEED=$s make verify PY=python3
          done

      - name: docker build and offline run
        run: make docker-verify

      # The closed jury run of README («Закрытый прогон жюри»), word for word, with the README example policy.
      - name: closed run of an external policy in Docker under auditpolicy
        run: |
          docker run --rm --network none -v "$PWD/examples/my_policy.py:/policy/my_policy.py:ro" auditenv:dev python3 -m auditenv.run --policy-cmd "python3 /policy/my_policy.py" --config '{}' --seed 7 --mode eval --sandbox required | tee closed_run.json
          grep -q '"sandbox": "uid"' closed_run.json
